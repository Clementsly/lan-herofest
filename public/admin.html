<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin – HeroFest LAN</title><link rel="stylesheet" href="/style.css"><script src="/i18n.js"></script></head><body>
<header><h1>HEROFEST <span>ADMIN</span></h1><div class="hdr-r"><div id="who"></div><div id="lang"></div></div></header>
<main>
 <section id="login" class="card center hidden"><h2 data-i18n="staffArea"></h2>
  <p class="muted" style="margin-bottom:16px" data-i18n="staffIntro"></p>
  <a href="/auth/discord?admin=1"><button class="btn-discord" data-i18n="discordLogin"></button></a>
  <p id="err" class="muted" style="color:#ff9b9e;margin-top:12px"></p></section>
 <div id="panel" class="hidden" style="display:grid;gap:20px">
  <section id="rcard" class="card"><h2><span data-i18n="duoReqs"></span> <span id="rcount" class="count hidden"></span></h2><div id="reqs"></div></section>
  <section id="acard" class="card"><h2 data-i18n="annAdminTitle"></h2>
   <textarea id="anntxt" data-i18n-ph="annPh"></textarea>
   <div class="opts"><label><input type="radio" name="aud" value="all" checked> <span data-i18n="annAll"></span></label><label><input type="radio" name="aud" value="confirmed"> <span data-i18n="annConfirmed"></span></label><label><input type="checkbox" id="annimp"> <span data-i18n="annImportant"></span></label></div>
   <button class="btn" onclick="announce()" data-i18n="annSend"></button>
   <h2 style="margin-top:18px" data-i18n="annSent"></h2><div id="annlist"></div></section>
  <section id="dcard" class="card"><h2 data-i18n="dispatchTitle"></h2>
   <p id="status" class="muted" style="margin-bottom:12px"></p>
   <div class="row"><input id="key" data-i18n-ph="keyPh"><button class="btn-green" onclick="start()" data-i18n="start"></button><button class="btn-red" onclick="stop()" data-i18n="stop"></button></div></section>
  <section class="card"><h2 data-i18n="playerMsgs"></h2>
   <div class="grid2"><div id="threads"></div>
    <div><div id="thead" class="thead"></div><div id="chat" class="chat"></div>
     <div class="row"><input id="txt" data-i18n-ph="replyPh" onkeydown="if(event.key==='Enter')reply()"><button class="btn" onclick="reply()" data-i18n="send"></button><button id="delbtn" class="btn-ghost" data-i18n-title="delTitle" onclick="del()" data-i18n="del"></button></div></div></div></section>
 </div>
</main>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const post=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});
let sel=null, lastSig='', unreadTotal=0, S=null, noRoleUser=null;
const uname=u=>esc(u.name)+(u.guest?' ('+L('guest')+')':'');
async function logout(){await post('/auth/logout');location.href='/admin';}
async function start(){const key=$('key').value.trim();if(!key)return alert(L('enterKey'));await post('/api/admin/dispatch/start',{key});load();}
async function stop(){await post('/api/admin/dispatch/stop');load();}
async function reply(){const text=$('txt').value.trim();if(!sel||!text)return;$('txt').value='';await post('/api/admin/reply',{id:sel,text});load();}
async function del(){if(sel&&confirm(L('confirmDel'))){await post('/api/admin/delete',{id:sel});sel=null;lastSig='';load();}}
async function announce(){const text=$('anntxt').value.trim();if(!text)return;
 await post('/api/admin/announce',{text,audience:document.querySelector('input[name=aud]:checked').value,important:$('annimp').checked});
 $('anntxt').value='';$('annimp').checked=false;document.querySelector('input[value=all]').checked=true;annSig='';load();}
async function delAnn(id){await post('/api/admin/announce/delete',{id});annSig='';load();}
let annSig='';
async function invite(){if(sel){await post('/api/admin/invite',{id:sel});load();}}
async function duo(id,accept){await post('/api/admin/duo',{id,accept});load();}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(a.currentTime+.18);}catch{}}
function notify(txt){beep();try{if(Notification.permission==='granted'&&document.hidden)new Notification('HeroFest LAN',{body:txt});}catch{}}
document.addEventListener('click',()=>{try{if(Notification.permission==='default')Notification.requestPermission();}catch{}},{once:true});
let prevPending=null,prevUnread=null,reqSig='',headSig='';
function pick(id){sel=id;lastSig='';post('/api/admin/read',{id});load();}
function render(){
 if(!S){$('login').classList.remove('hidden');$('panel').classList.add('hidden');$('who').innerHTML='';
  $('err').innerHTML=noRoleUser&&noRoleUser.id[0]==='d'&&!noRoleUser.rolesKnown?L('checking'):noRoleUser?`${L('noRole',{n:esc(noRoleUser.name)})} <a href="#" style="color:#f5c518" onclick="logout()">${L('switchAcc')}</a>`:(new URLSearchParams(location.search).get('err')?L('errLogin'):'');return;}
 $('login').classList.add('hidden');$('panel').classList.remove('hidden');
 const d=S.dispatch, me=S.me;
 $('who').innerHTML=`<div class="user">${me.avatar?`<img src="${me.avatar}" alt="">`:''}<b>${esc(me.name)}</b><span class="badge">${me.lead?'Lead Admin':'Staff'}</span><button class="btn-ghost" onclick="logout()">${L('logout')}</button></div>`;
 $('dcard').classList.toggle('hidden',!me.lead);$('delbtn').classList.toggle('hidden',!me.lead);
 if(d) $('status').innerHTML=d.active?`<span class="dot on"></span>${L('active',{t:fmtTime(d.startedAt)})} <b style="color:#f5c518">${esc(d.key)}</b>`:`<span class="dot"></span>${L('inactive')}`;
 $('threads').innerHTML=S.threads.length?S.threads.map(x=>`<div class="thread ${x.id===sel?'sel':''}" onclick="pick('${x.id}')"><span>${uname(x.user)}${x.user.confirmed?' ✓':''}</span>${x.unread&&x.id!==sel?`<span class="count">${x.unread}</span>`:''}</div>`).join(''):`<p class="muted">${L('noMsg')}</p>`;
 // Annonces
 $('acard').classList.toggle('hidden',!me.lead);
 const an=S.announcements||[], as=LANG+an.map(a=>a.id).join();
 if(me.lead&&as!==annSig){annSig=as;$('annlist').innerHTML=an.length?an.map(a=>`<div class="ann ${a.important?'imp':''}" style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div>${esc(a.text)}<small>${esc(a.by)} · ${fmtTime(a.at)} · ${a.audience==='all'?L('annAll'):L('annConfirmed')}</small></div><button class="btn-ghost" onclick="delAnn('${a.id}')">${L('annDel')}</button></div>`).join(''):`<p class="muted">${L('annNone')}</p>`;}
 // Demandes de duo
 $('rcard').classList.toggle('hidden',!me.lead);
 const pend=S.threads.filter(x=>x.duo&&x.duo.status==='pending'), done=S.threads.filter(x=>x.duo&&x.duo.status==='accepted');
 $('rcount').textContent=pend.length;$('rcount').classList.toggle('hidden',!pend.length);
 const rs=LANG+JSON.stringify(pend.map(x=>[x.id,x.duo]))+done.length;
 if(me.lead&&rs!==reqSig){reqSig=rs;
  $('reqs').innerHTML=(pend.length?pend.map(x=>`<div class="req"><b>${L('duoWith',{a:esc(x.user.name),b:esc(x.duo.mate)})}</b><div class="row"><button class="btn-green" onclick="duo('${x.id}',true)">${L('accept')}</button><button class="btn-red" onclick="duo('${x.id}',false)">${L('refuse')}</button></div></div>`).join(''):`<p class="muted">${L('noReqs')}</p>`);}
 const th=S.threads.find(x=>x.id===sel), c=$('chat');
 const hs=LANG+(th?th.id+th.invited+JSON.stringify(th.duo):'')+me.lead;
 if(hs!==headSig){headSig=hs;$('thead').innerHTML=!th?'':`<b>${uname(th.user)}</b>`+(!th.user.guest||!me.lead?'':
   th.duo&&th.duo.status==='accepted'?`<span class="pill">✓ ${L('statusAccepted')} · ${L('codesTitle')} <b>${esc(th.user.name)}</b> <code>${th.duo.codes[0]}</code> · <b>${esc(th.duo.mate)}</b> <code>${th.duo.codes[1]}</code></span>`
   :th.duo&&th.duo.status==='refused'&&!th.invited?'':th.duo&&th.duo.status==='pending'?`<span class="pill">${L('duoWith',{a:esc(th.user.name),b:esc(th.duo.mate)})}</span>`
   :th.invited?`<span class="pill">${L('accessGiven')}</span>`:`<button class="btn-green" onclick="invite()">${L('giveAccess')}</button>`);}
 if(!th){if(lastSig!==LANG){lastSig=LANG;c.innerHTML=`<p class="muted center">${L('pickThread')}</p>`;}return;}
 const sig=LANG+sel+th.messages.length; if(sig!==lastSig){lastSig=sig;
  c.innerHTML=th.messages.map(m=>`<div class="msg ${m.from==='admin'?'me':'them'}">${esc(m.text)}<small>${m.from==='user'?uname(th.user)+' · ':(m.by?esc(m.by)+' · ':'')}${fmtTime(m.at)}</small></div>`).join('');c.scrollTop=c.scrollHeight;}
}
async function load(){
 const r=await fetch('/api/admin/state');
 if(r.status===401){const j=await r.json();S=null;noRoleUser=j.user;render();return;}
 S=await r.json();
 const th=S.threads.find(x=>x.id===sel); if(th&&th.unread) post('/api/admin/read',{id:sel});
 const unread=S.threads.reduce((a,x)=>a+(x.id===sel?0:x.unread),0);
 unreadTotal=unread; document.title=(unread?`(${unread}) `:'')+'Admin – HeroFest LAN';
 render();
 if(S.me.lead&&prevPending!==null&&countPend(S)>prevPending) notify(L('notifDuo'));
 if(prevUnread!==null&&unread>prevUnread) notify(L('notifMsg'));
 prevPending=S.me.lead?countPend(S):0;prevUnread=unread;
}
const countPend=S=>S.threads.filter(x=>x.duo&&x.duo.status==='pending').length;
window.onLangChange=()=>{lastSig='';reqSig='';headSig='';annSig='';render();};
load();setInterval(load,2000);
</script></body></html>
