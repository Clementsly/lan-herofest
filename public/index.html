<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HeroFest Fortnite 2026 – LAN</title><link rel="stylesheet" href="/style.css"><script src="/i18n.js"></script></head><body>
<header><h1>HEROFEST <span>FORTNITE</span> 2026</h1><div class="hdr-r"><div id="who"></div><div id="lang"></div></div></header>
<main>
 <section id="login" class="card center hidden">
  <h2 data-i18n="welcome"></h2>
  <p class="muted" style="margin-bottom:16px" data-i18n="loginIntro"></p>
  <a href="/auth/discord"><button class="btn-discord" data-i18n="discordLogin"></button></a>
  <p class="muted" style="margin:22px 0 10px" data-i18n="noDiscord"></p>
  <div class="row" style="max-width:420px;margin:auto"><input id="gname" data-i18n-ph="nickname"><button class="btn-ghost" onclick="guest()" data-i18n="support"></button></div>
  <p class="muted" style="margin:22px 0 10px" data-i18n="haveCode"></p>
  <div class="row" style="max-width:520px;margin:auto"><input id="cname" data-i18n-ph="nickname"><input id="ccode" data-i18n-ph="codePh" style="max-width:150px;text-transform:uppercase" onkeydown="if(event.key==='Enter')codeLogin()"><button class="btn-ghost" onclick="codeLogin()" data-i18n="codeLogin"></button></div>
  <p id="err" class="muted" style="color:#ff9b9e;margin-top:10px"></p>
 </section>
 <section id="anncard" class="card hidden"><h2 data-i18n="annTitle"></h2><div id="anns"></div></section>
 <section id="invite" class="card hidden"><h2 data-i18n="inviteTitle"></h2><div id="invitebox"></div></section>
 <section id="keycard" class="card hidden"><h2 data-i18n="keyTitle"></h2><div id="keybox"></div></section>
 <section id="noaccess" class="card hidden"><h2 data-i18n="limited"></h2>
  <p class="muted"><span data-i18n="limitedText"></span> <span id="joinhint"></span></p></section>
 <section id="support" class="card hidden"><h2 data-i18n="supportTitle"></h2>
  <div id="chat" class="chat"></div>
  <div class="row"><input id="txt" data-i18n-ph="msgPh" onkeydown="if(event.key==='Enter')send()"><button class="btn" onclick="send()" data-i18n="send"></button></div>
 </section>
 <section id="dccard" class="card dc-wrap"><h2 data-i18n="dcTitle"></h2><div id="dcbox"></div></section>
</main>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lastSig='', S=null;
const errKey={auth:'errAuth',token:'errDiscord',discord:'errDiscord'}, qerr=new URLSearchParams(location.search).get('err');
async function guest(){const r=await fetch('/auth/guest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('gname').value})});if(r.ok)load();}
async function codeLogin(){const r=await fetch('/auth/code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('cname').value,code:$('ccode').value})});
 if(r.ok){load();}else $('err').textContent=L('badCode');}
async function sendDuo(){const mate=$('mate').value.trim();if(!mate)return;await fetch('/api/duo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mate})});inviteSig='';load();}
async function logout(){await fetch('/auth/logout',{method:'POST'});location.href='/';}
async function send(){const text=$('txt').value.trim();if(!text)return;$('txt').value='';
 await fetch('/api/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});load();}
async function copyKey(b){const k=S.dispatch.key;let ok=false;
 try{await navigator.clipboard.writeText(k);ok=true;}catch{try{const ta=document.createElement('textarea');ta.value=k;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove();}catch{}}
 b.textContent=ok?L('copied'):L('copyFail');setTimeout(()=>{b.textContent=L('copyKey')},2000);}
const MASK='•'.repeat(10);
function reveal(on){const k=$('keyval');if(k){k.textContent=on?S.dispatch.key:MASK;k.classList.toggle('masked',!on);}}
let keySig='',inviteSig='',annSig='',seenAnn=null;
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=660;g.gain.value=.12;o.start();o.stop(a.currentTime+.2);}catch{}}
function render(){
 if(!S){$('login').classList.remove('hidden');['keycard','noaccess','support','invite','anncard'].forEach(i=>$(i).classList.add('hidden'));$('who').innerHTML='';
  $('err').textContent=qerr?L(errKey[qerr]||'errDiscord'):'';return;}
 const u=S.user;
 $('login').classList.add('hidden');$('support').classList.remove('hidden');
 $('who').innerHTML=`<div class="user">${u.avatar?`<img src="${u.avatar}" alt="">`:''}<b>${esc(u.name)}${u.guest?' ('+L('guest')+')':''}</b><span class="badge ${u.confirmed?'':'no'}">${u.confirmed?L('confirmedBadge'):L('supportOnly')}</span>${u.staff?`<a href="/admin"><button class="btn">${L('staffArea')}</button></a>`:''}<button class="btn-ghost" onclick="logout()">${L('logout')}</button></div>`;
 $('keycard').classList.toggle('hidden',!u.confirmed);$('noaccess').classList.toggle('hidden',u.confirmed||u.guest);
 $('joinhint').innerHTML=u.id[0]==='d'&&!u.inGuild&&u.rolesKnown?L('notInGuild'):'';
 $('noaccess').querySelector('[data-i18n]').innerHTML=u.id[0]==='d'&&!u.rolesKnown?L('checking'):L('limitedText');
 const ks=LANG+u.confirmed+S.dispatch.active+(S.dispatch.key||'');
 if(u.confirmed&&ks!==keySig){keySig=ks;$('keybox').innerHTML=S.dispatch.active
  ?`<p class="muted center" style="margin-bottom:10px"><span class="dot on"></span>${L('dispatchLive')}</p><div id="keyval" class="key masked">${MASK}</div>
   <div class="btns"><button class="btn" onclick="copyKey(this)">${L('copyKey')}</button><button class="btn-ghost" onmousedown="reveal(1)" onmouseup="reveal(0)" onmouseleave="reveal(0)" ontouchstart="reveal(1);event.preventDefault()" ontouchend="reveal(0)">${L('hold')}</button></div>
   <p class="note">${L('streamerSafe')}</p>`
  :`<div class="wait"><span class="dot"></span>${L('noKey')}</div>`;}
 if(!u.confirmed) keySig='';
 // Annonces
 const an=S.announcements||[]; $('anncard').classList.toggle('hidden',!an.length);
 const as=LANG+an.map(a=>a.id).join();
 if(as!==annSig){annSig=as;const known=seenAnn||new Set(an.map(a=>a.id));
  const fresh=an.filter(a=>!known.has(a.id));
  $('anns').innerHTML=an.map(a=>`<div class="ann ${a.important?'imp':''} ${fresh.includes(a)?'new':''}">${esc(a.text)}<small>${esc(a.by)} · ${fmtTime(a.at)}</small></div>`).join('');
  if(fresh.length){beep();document.title='('+L('annNew')+') HeroFest Fortnite 2026';setTimeout(()=>document.title='HeroFest Fortnite 2026 – LAN',6000);}
  seenAnn=new Set(an.map(a=>a.id));}
 // Accès sans Discord (duo)
 const d=S.duo, showInv=u.guest&&(S.invited||d);
 $('invite').classList.toggle('hidden',!showInv);
 const is=LANG+JSON.stringify(d)+S.invited;
 if(showInv&&is!==inviteSig){inviteSig=is;const form=`<div class="row" style="max-width:460px"><input id="mate" data-i18n-ph="matePh" placeholder="${L('matePh')}" onkeydown="if(event.key==='Enter')sendDuo()"><button class="btn" onclick="sendDuo()">${L('sendDuo')}</button></div>`;
  $('invitebox').innerHTML=!d?`<p class="muted" style="margin-bottom:12px">${L('inviteText')}</p>${form}`
   :d.status==='pending'?`<p class="muted"><span class="dot"></span>${L('duoPending',{m:esc(d.mate)})}</p>`
   :d.status==='refused'?`<p class="muted" style="margin-bottom:12px">${L('duoRefused',{m:esc(d.mate)})}</p>${form}`
   :`<p style="margin-bottom:10px"><span class="dot on"></span>${L('duoAccepted',{m:esc(d.mate)})}</p><p class="muted">${L('myCode')}</p><div class="codebox">${d.myCode}</div><p class="muted">${L('mateCode',{m:esc(d.mate)})}</p><div class="codebox">${d.mateCode}</div>`;}
 const sig=LANG+S.messages.length; if(sig!==lastSig){lastSig=sig;const c=$('chat');
  c.innerHTML=S.messages.length?S.messages.map(m=>`<div class="msg ${m.from==='user'?'me':'them'}">${esc(m.text)}<small>${m.from==='admin'?L('admin')+(m.by?' ('+esc(m.by)+')':'')+' · ':''}${fmtTime(m.at)}</small></div>`).join(''):`<p class="muted center">${L('emptyChat')}</p>`;
  c.scrollTop=c.scrollHeight;}
}
async function load(){const r=await fetch('/api/state');S=r.status===401?null:await r.json();render();}
let DC=null;
const DCSVG='<svg viewBox="0 0 24 24"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.6 1.3a18.4 18.4 0 0 0-5.6 0L8.6 3a19.7 19.7 0 0 0-4.9 1.5C.6 9.1-.3 13.6.1 18.1a19.9 19.9 0 0 0 6 3l1.3-2.1c-.7-.3-1.4-.6-2-1l.5-.4a14.2 14.2 0 0 0 12.2 0l.5.4c-.6.4-1.3.7-2 1l1.3 2.1a19.8 19.8 0 0 0 6-3c.5-5.2-.9-9.7-3.6-13.7ZM8 15.3c-1.2 0-2.2-1.1-2.2-2.4S6.8 10.5 8 10.5s2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Zm8 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Z"/></svg>';
function renderDC(){if(!DC)return;const n=x=>Number(x).toLocaleString(LOCALES[LANG]);
 $('dcbox').innerHTML=`<div class="dc">${DC.icon?`<img src="${DC.icon}" alt="">`:`<div class="ph">HF</div>`}<div class="dc-info"><div class="dc-name">${esc(DC.name)}</div><div class="dc-stats">${DC.online!=null?`<span><span class="dot on"></span>${L('dcOnline',{n:n(DC.online)})}</span>`:''}${DC.members!=null?`<span><span class="dot grey"></span>${L('dcMembers',{n:n(DC.members)})}</span>`:''}</div></div><a class="dc-join" href="${DC.url}" target="_blank" rel="noopener">${DCSVG}${L('dcJoin')}</a></div>`;}
fetch('/api/discord-invite').then(r=>r.json()).then(d=>{DC=d;renderDC();});
window.onLangChange=()=>{renderDC();lastSig='';keySig='';inviteSig='';annSig='';render();};
load();setInterval(load,2000);
</script></body></html>
